# Universal Test -- GitHub Actions example (Phase 8).
#
# This is a TEMPLATE, not a working pipeline: it assumes your own project
# already starts its own service somehow and exposes it at a known URL
# before "Run Quality Gate" runs -- replace TARGET_URL and the placeholder
# "Start your application" step with whatever your project actually needs
# (docker compose up, a background server, a deployed preview URL, ...).
# universal-test never starts, builds, or deploys the project under test.
#
# What this demonstrates:
#   - installing universal-test in CI
#   - --ci --yes for a fully non-interactive run (neither flag alone is
#     enough: --ci never authorizes network traffic by itself -- see
#     ARCHITECTURE.md section 12 / README.md's CI/CD section)
#   - --baseline for regression comparison against a checked-in baseline.json
#     (see "Baseline strategy" below -- this workflow never overwrites it)
#   - uploading reports/ as a build artifact regardless of pass/fail
#   - the CLI's own exit code (0/1/2/3) as the job's pass/fail signal --
#     no extra shell parsing of report.json is needed for the basic case

name: Universal Test

on:
  pull_request:
  push:
    branches: [main]

env:
  TARGET_URL: http://localhost:8080   # replace with your application's URL

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Universal Test
        run: python -m pip install universal-test

      # Replace with however your project actually starts (docker compose,
      # a background process, a deployed preview environment, ...).
      - name: Start your application
        run: |
          echo "TODO: start the application under test at $TARGET_URL"

      - name: Run Quality Gate
        run: |
          universal-test assess . \
            --ci --yes \
            --target "$TARGET_URL" \
            --baseline baseline.json \
            --output reports/
        # Exit code contract (ARCHITECTURE.md section 12 / README.md):
        #   0 = Quality Gate passed   1 = Quality Gate failed (regression/threshold)
        #   2 = configuration error   3 = infrastructure/execution error (e.g. target unreachable)
        # A nonzero exit here fails this step, which fails the job -- no
        # extra `if` logic is needed for the common case. Distinguish 1 vs 3
        # in a later step only if you want different handling for "the app
        # regressed" vs. "the app never came up".

      - name: Upload reports
        if: always()   # keep the report whether the gate passed or failed
        uses: actions/upload-artifact@v4
        with:
          name: universal-test-reports
          path: reports/

# --- Baseline strategy -------------------------------------------------
# baseline.json is read-only input to this workflow -- 'baseline compare'
# and 'assess --baseline' never write to it (ARCHITECTURE.md section 11.3).
# Update it deliberately, as its own separate, explicit step (e.g. a
# maintainer-triggered workflow_dispatch job, or a scheduled job on `main`
# only) -- never as a side effect of a PR's own quality-gate run:
#
#   universal-test baseline save . --target "$TARGET_URL" --output baseline.json
#   git add baseline.json && git commit -m "chore: update baseline"
#
# See README.md's "Pull request workflow" section for the recommended
# main -> baseline, feature-branch -> compare -> gate flow.
