openapi: "3.0.0"
info:
  title: E2E Project API
  version: "1.0"
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
  /fast:
    get:
      operationId: getFast
      responses:
        "200":
          description: OK
