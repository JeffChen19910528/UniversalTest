openapi: "3.0.0"
info:
  title: Auth Fixture API
  version: "1.0"
paths:
  /secure:
    get:
      operationId: getSecure
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
